services:
  bingo:
    build: .
    restart: unless-stopped
    ports:
      - "20940:8082"
    environment:
      PORT: 8082
      FRONTEND_URL: ${FRONTEND_URL:-https://bingo.ricky-nova.com}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
